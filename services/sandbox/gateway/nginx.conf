# Gateway to the sandbox. go-judge sits alone on an internal network without a route outside; this proxy is the only
# other member of that network, so even a compromised go-judge cannot reach the application, the database or the
# storage. Only the three endpoints the adapter uses pass (src/lib/server/sandbox/go-judge.ts): running a program,
# removing a compiled program from the store and the engine version. Uploading files, listing and reading the
# store, the WebSocket and streaming interfaces stay closed.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 64;
}

http {
	access_log off;
	server_tokens off;
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	upstream sandbox {
		server sandbox:5050;
	}

	server {
		listen 8080;

		# One test input (8 MB, src/lib/server/sandbox/request.ts) plus the source code.
		client_max_body_size 10m;
		client_body_buffer_size 1m;

		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_connect_timeout 5s;
		proxy_send_timeout 30s;
		# Above the longest single program: 60 s of compile wall time at the largest compile limit.
		proxy_read_timeout 90s;

		location = /run {
			limit_except POST {
				deny all;
			}
			proxy_pass http://sandbox;
		}

		location ~ ^/file/[A-Za-z0-9]+$ {
			limit_except DELETE {
				deny all;
			}
			proxy_pass http://sandbox;
		}

		location = /version {
			limit_except GET {
				deny all;
			}
			proxy_pass http://sandbox;
		}

		location / {
			return 404;
		}

		error_page 502 504 = @unavailable;

		location @unavailable {
			default_type application/json;
			return 503 '"sandbox is unavailable"';
		}
	}
}
