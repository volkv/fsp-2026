# System call filter of every program go-judge runs: compilers and solutions alike (-seccomp-conf, set by
# entrypoint.sh). Format: elastic/go-seccomp-bpf policy, as go-judge built with the seccomp tag reads it; x86_64 only
# (the names are those of its x86_64 table, an unknown name stops go-judge at start).
#
# The container's own profile (seccomp.json) has to allow namespaces and mounts for go-judge itself; this one takes
# them away from the programs. An allowlist: Docker's default list (moby/profiles seccomp v0.2.3, the calls it allows
# every container) plus arch_prctl, with no namespace, mount, keyring, bpf, io_uring, userfaultfd, perf or ptrace
# calls. Anything else fails with EPERM, and so does every call through the 32-bit entry (int 0x80), whose numbers
# differ and would pass a filter written for 64-bit ones.
default_action: errno
syscalls:
  - action: allow
    names:
      - accept
      - accept4
      - access
      - adjtimex
      - alarm
      - arch_prctl
      - bind
      - brk
      - cachestat
      - capget
      - capset
