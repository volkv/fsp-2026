  # Threads and processes, never with a flag of a new namespace: CLONE_NEWNS, NEWCGROUP, NEWUTS, NEWIPC, NEWUSER,
  # NEWPID, NEWNET (0x7e020000).
  - action: allow
    names_with_args:
      - name: clone
        arguments:
          - argument: 0
            operation: BitsNotSet
            value: 2114060288
  # clone3 passes its flags in memory a filter cannot read, so it is refused as missing (a return to the absent
  # tracer means ENOSYS): glibc then falls back to clone, which is checked above.
  - action: trace
    names:
      - clone3
  # Sockets: AF_UNIX (1), AF_INET (2) and AF_INET6 (10) only (the program has no network interface but a loopback that is down); no netlink, packet
  # or other families.
  - action: allow
    names_with_args:
      - name: socket
        arguments:
          - argument: 0
            operation: Equal
            value: 1
      - name: socket
        arguments:
          - argument: 0
            operation: Equal
            value: 2
      - name: socket
        arguments:
          - argument: 0
            operation: Equal
            value: 10
  # Execution domains Docker allows: PER_LINUX, UNAME26, PER_LINUX32, their combination and the query.
  - action: allow
    names_with_args:
      - name: personality
        arguments:
          - argument: 0
            operation: Equal
            value: 0
      - name: personality
        arguments:
          - argument: 0
            operation: Equal
            value: 8
      - name: personality
        arguments:
          - argument: 0
            operation: Equal
            value: 131072
      - name: personality
        arguments:
          - argument: 0
            operation: Equal
            value: 131080
      - name: personality
        arguments:
          - argument: 0
            operation: Equal
            value: 4294967295
