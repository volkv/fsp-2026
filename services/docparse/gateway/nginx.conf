# Gateway to docparse. docparse sits alone on an internal network without a route outside; this proxy is the only
# other member of that network, so a compromised parser cannot reach the application, the database or the storage.
# The gateway only forwards requests to docparse; errors it generates itself follow the docparse/v1 error body.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 64;
}

http {
	access_log off;
	server_tokens off;
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	upstream docparse {
		server docparse:8000;
	}

	server {
		listen 8080;

		# docparse enforces the exact 10 MB file limit itself; this only stops bodies far above it.
		client_max_body_size 12m;
		client_body_buffer_size 1m;

		location /v1/ {
			proxy_pass http://docparse;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_connect_timeout 5s;
			# Above the 90 s OCR budget: docparse answers with its own `timeout` error first.
			proxy_read_timeout 120s;
			proxy_send_timeout 60s;
		}

		location / {
			default_type application/json;
			return 404 '{"error":{"code":"bad_request","retryable":false,"message":"Unknown route"}}';
		}

		error_page 413 = @too_large;
		error_page 502 504 = @unavailable;

		location @too_large {
			default_type application/json;
			return 413 '{"error":{"code":"too_large","retryable":false,"message":"File exceeds size limit"}}';
		}

		location @unavailable {
			default_type application/json;
			return 503 '{"error":{"code":"busy","retryable":true,"message":"Parser is unavailable"}}';
		}
	}
}
