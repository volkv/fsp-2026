[project]
name = "docparse"
version = "1.0.0"
description = "Stateless resume file parser: text with addressable blocks"
requires-python = "==3.13.*"
dependencies = [
    "charset-normalizer",
    "lxml",
    "pdfminer-six",
    "pdfplumber",
    "pillow",
    "pypdf",
    "python-docx",
    "python-multipart",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "jsonschema",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RET", "PTH", "PL", "RUF", "SLF", "PT", "TRY", "ERA"]
ignore = [
    "PLR0913",  # extractors take explicit keyword arguments
    "PLR2004",  # comparisons with named-in-context literals (HTTP statuses, exit codes)
    "TRY003",   # messages are part of the error contract, not generic exceptions
    "RUF001",   # Russian text: Cyrillic letters are not confusables here
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
filterwarnings = ["error"]
