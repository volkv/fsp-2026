[project]
name = "fsp-eval"
version = "1.0.0"
description = "Quality evaluation harness: synthetic resumes with independent labels, metrics of the product's pipeline"
requires-python = "==3.13.*"
dependencies = [
    "reportlab",
    "python-docx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RET", "PTH", "PL", "RUF", "SLF", "PT", "TRY", "ERA"]
ignore = [
    "PLR0913",  # builders take explicit keyword arguments
    "PLR2004",  # comparisons with named-in-context literals (months, shares)
    "TRY003",   # messages are part of the error, not generic exceptions
    "S311",     # the pseudo-random generator draws synthetic data from a fixed seed, not secrets
    "RUF001",   # Russian text: Cyrillic letters are not confusables here
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001"]
"src/fsp_eval/bridge.py" = ["S603"]  # the bridge command line is built from fixed parts, not from input

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
filterwarnings = ["error"]
